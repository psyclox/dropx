name: dropx
description: DropX - Ultra-fast offline peer-to-peer file sharing for Android and Windows
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Animation
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  glassmorphism: ^3.0.0
  
  # Navigation
  go_router: ^14.6.2
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking & P2P
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  network_info_plus: ^6.0.0
  wifi_iot: ^0.3.19+1
  nearby_connections: ^4.1.0
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  
  # File System
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  share_plus: ^10.0.2
  open_filex: ^4.6.0
  
  # Media
  photo_manager: ^3.6.0
  video_player: ^2.9.2
  chewie: ^1.8.5
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.3.0
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Storage & Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4+4
  shared_preferences: ^2.3.2
  
  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  crypto: ^3.0.3
  mime: ^2.0.0
  rxdart: ^0.28.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  device_info_plus: ^11.1.0
  connectivity_plus: ^6.1.0
  wakelock_plus: ^1.2.8
  
  # Platform specifics
  hotspot_manager: ^0.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/animations/

